services:
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports: [4000:4000]
    depends_on:
      - postgres
    env_file:
      - .env

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: library
    ports: [5432:5432]
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
